<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heimdall Stream</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        text-align: center;
        padding: 40px;
      }

      h1 {
        margin-bottom: 20px;
      }

      .card {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
        width: 400px;
        margin: auto;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      input {
        margin: 10px 0;
      }

      button {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
      }

      .start {
        background: #22c55e;
        color: black;
      }

      .stop {
        background: #ef4444;
        color: white;
      }

      .upload {
        background: #3b82f6;
        color: white;
      }

      #status {
        margin-top: 15px;
        font-size: 14px;
        color: #94a3b8;
      }

      #link {
        margin-top: 10px;
        font-weight: bold;
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <h1>Argus Stream</h1>

    <div class="card">
      <h3>Upload Video</h3>

      <form id="uploadForm">
        <input type="file" name="video" accept="video/*" required />
        <br />
        <button class="upload" type="submit">Upload</button>
      </form>

      <hr />

      <h3>Controls</h3>

      <button class="start" id="startStream">Start Stream</button>
      <button class="stop" id="stopStream">Stop Stream</button>

      <p id="status">Status: Idle</p>

      <p>Viewer Link:</p>
      <p id="link"></p>
    </div>

    <script>
      const form = document.getElementById("uploadForm");
      const status = document.getElementById("status");
      const link = document.getElementById("link");

      const startBtn = document.getElementById("startStream");
      const stopBtn = document.getElementById("stopStream");

      const ip = window.location.hostname;
      link.innerText = `http://${ip}:8889/live`;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        status.innerText = "Uploading...";

        try {
          const res = await fetch("/upload", {
            method: "POST",
            body: formData,
          });

          const text = await res.text();
          status.innerText = " Uploaded successfully";
          alert(text);
        } catch (err) {
          status.innerText = " Upload failed";
          console.error(err);
        }
      });

      startBtn.addEventListener("click", async () => {
        status.innerText = "Starting stream...";

        try {
          const res = await fetch("/start-stream", {
            method: "POST",
          });

          const text = await res.text();
          status.innerText = " Streaming live";
          alert(text);
        } catch (err) {
          status.innerText = " Failed to start stream";
          console.error(err);
        }
      });

      stopBtn.addEventListener("click", async () => {
        status.innerText = "Stopping stream...";

        try {
          const res = await fetch("/stop");
          const text = await res.text();

          status.innerText = " Stream stopped";
          alert(text);
        } catch (err) {
          status.innerText = " Failed to stop";
          console.error(err);
        }
      });
    </script>
  </body>
</html>
